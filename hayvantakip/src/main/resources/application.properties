# Server Port
server.port=8080

# Supabase Pooler JDBC URL (Adres kısmını buraya yazıyoruz)
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres

# Kullanıcı Adı (user= parametresindeki değer)
spring.datasource.username=postgres.apwmarezyxcqqdjsaffa

# Şifre (Supabase'i kurarken belirlediğin kendi şifren)
spring.datasource.password=8802.Ek321*

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Tabloları Otomatik Oluştur
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.open-in-view=false

# Hibernate PostgreSQL Dialect uyarısını kaldırmak için
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


#supabase ile ilgili olanlar 

# HikariCP havuz ayarlarını Supabase limitlerine göre sınırla
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# Hibernate metadata taramasında prepared statement kullanımını engelle
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
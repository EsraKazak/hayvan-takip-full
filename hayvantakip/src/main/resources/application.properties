# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Tabloları Otomatik Oluştur
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.open-in-view=false

# Hibernate PostgreSQL Dialect uyarısını kaldırmak için
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


#supabase ile ilgili olanlar 

# HikariCP havuz ayarlarını Supabase limitlerine göre sınırla
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# Hibernate metadata taramasında prepared statement kullanımını engelle
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Lazy yüklenen veya boş kalan ilişkilerin JSON dönüştürmede patlamasını engeller
spring.jackson.serialization.fail-on-empty-beans=false

# JSON serileştirmede null alanları göz ardı et veya boş yaz
spring.jackson.default-property-inclusion=non_null

# Supabase Pooler için Prepared Statement'ı sürücü seviyesinde kesin kapatır
spring.datasource.hikari.data-source-properties.prepareThreshold=0


